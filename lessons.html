<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lessons — Spanish Starter Pack</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body data-page="lessons">
    <div class="container" style="margin-top: 28px">
      <div class="articles-lesson">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
          "
        >
          <div>
            <h1 style="font-family: var(--font-display); font-size: 2rem">
              All Lessons
            </h1>
            <p style="color: var(--color-text-muted); margin-top: 4px">
              Learn Spanish step by step
            </p>
          </div>
        </div>

        <!-- Lecciones dinámicas de Supabase -->
        <div id="dynamic-lessons"></div>
      </div>
    </div>

    <script src="supabase-service.js"></script>
    <script src="components.js"></script>
    <script>
      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await new Promise((r) => setTimeout(r, 500)); // esperar que Supabase inicie
        try {
          const lessons = await LessonsService.getAll(true);
          if (!lessons.length) return;

          const container = document.getElementById("dynamic-lessons");
          container.innerHTML = `
        <div style="margin-bottom:20px;padding:12px 16px;background:var(--color-surface-2);border-radius:var(--radius-sm);border-left:3px solid var(--color-accent)">
          <strong style="font-size:0.85rem;color:var(--color-accent)">NEW LESSONS</strong>
          <span style="font-size:0.85rem;color:var(--color-text-muted);margin-left:8px">Latest content from the admin panel</span>
        </div>
        ${lessons
          .map(
            (l) => `
          <div class="article">
            <h2>${escapeHtml(l.title)}</h2>
            <p>${escapeHtml(l.summary || "")}</p>
            ${(l.tags || []).map((t) => `<span class="lesson-tag" style="margin-right:4px">${escapeHtml(t)}</span>`).join("")}
            <br>
            <a href="lesson.html?slug=${encodeURIComponent(l.slug || "")}" class="read-more">Read More →</a>
          </div>
        `,
          )
          .join("")}
        <hr style="border:none;border-top:2px solid var(--color-border);margin:24px 0">
        <p style="font-size:0.85rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--color-text-light);margin-bottom:16px">Classic Lessons</p>
      `;
        } catch (e) {
          console.info("No se pudieron cargar lecciones dinámicas:", e.message);
        }
      });
    </script>
  </body>
</html>
